<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gun Challenge</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="app.js"></script>
</head>
<body>
  <h1>Gun Challenge</h1>

  <!-- Start Screen -->
  <div id="start-screen">
    <button id="start-btn">Start Game</button>
    <button id="rules-btn">How to Play</button>
  </div>

  <!-- Instructions Modal (Card 1) -->
  <div id="rules-box" class="hidden">
    <h3>How to Play</h3>
    <p>Aim with the mouse and click to shoot moving targets. Miss more than 3 shots and you lose!</p>
    <button id="close-rules-btn">Close</button>
  </div>

  <!-- Initial Game Board (Card 2) -->
  <div id="game-board" class="hidden">
    <p>Stage: <span id="stage">1</span> | Score: <span id="score">0</span> | Missed: <span id="missed">0</span>/3</p>
    <div class="arena">
      <div class="target"></div>
      <div class="gun"></div>
    </div>
  </div>
</body>
</html>
